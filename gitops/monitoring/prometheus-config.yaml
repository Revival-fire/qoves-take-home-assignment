apiVersion: v1

kind: ConfigMap

metadata:
  name: prometheus-config

  namespace: qoves-app

data:
  prometheus.yml: |

    global:

      scrape_interval: 15s

    rule_files:


      - "/etc/prometheus/rules/*.yaml"

    scrape_configs:

      - job_name: qoves-api


        kubernetes_sd_configs:


        - role: pod

        relabel_configs:


        - source_labels:

          - __meta_kubernetes_pod_label_app
          action: keep
          regex: qoves-api
