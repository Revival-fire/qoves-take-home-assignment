apiVersion: apps/v1

kind: Deployment

metadata:
  name: prometheus

  namespace: qoves-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus

          image: prom/prometheus:v3.0.1

          ports:
            - containerPort: 9090

          volumeMounts:
            - name: config

              mountPath: /etc/prometheus

            - name: rules

              mountPath: /etc/prometheus/rules

      volumes:
        - name: config

          configMap:
            name: prometheus-config

        - name: rules

          configMap:
            name: prometheus-rules
