apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: qoves-api-hpa

  namespace: qoves-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1

    kind: Deployment

    name: qoves-api

  minReplicas: 1

  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization

          averageUtilization: 70
